<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17382a" />
    <title>You're offline · Fore the Record</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px;
        display: grid;
        place-items: center;
        color: #17382a;
        background: #f3f0e8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 540px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid rgba(23, 56, 42, .16);
        border-radius: 20px;
        background: #fffdf7;
      }
      .eyebrow { margin: 0 0 20px; color: #315844; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(44px, 9vw, 72px); font-weight: 400; line-height: 1; }
      p:not(.eyebrow) { margin: 22px 0 30px; color: #637068; line-height: 1.6; }
      button { min-height: 52px; padding: 0 24px; border: 0; border-radius: 8px; color: white; background: #17382a; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #d7ff4f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Fore the Record</p>
      <h1>You're offline.</h1>
      <p>Your private rounds and account details need a connection. Reconnect, then try opening your record again.</p>
      <form action="/" method="get"><button type="submit">Try again</button></form>
    </main>
  </body>
</html>
